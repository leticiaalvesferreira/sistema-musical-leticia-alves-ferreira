<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Artista Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- A mesma barra de título da Biblioteca -->
        <div class="page-header-bar">
            <h2>➕ Novo Artista</h2>
            <div class="header-actions">
                <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO DO ARTISTA
             method="post": envia os dados escondidos. É o certo para cadastrar.
             enctype="multipart/form-data": OBRIGATÓRIO para enviar arquivos -->
        <form method="post" action="#" enctype="multipart/form-data">
            <!-- form-grid: os campos se encaixam 2 por linha. -->
            <div class="form-grid">
                <div class="form-group">
                    <!-- O vermelho avisa que o campo é obrigatório. -->
                    <label for="nome">Nome do Artista <span style="color:var(--red)">*</span></label>
                    <!-- required: o navegador não deixa cadastrar sem nome. -->
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Djavan, Marisa Monte...">
                </div>

                <div class="form-group">
                    <!-- Campo opcional (sem required) -->
                    <label for="genero">Gênero Musical</label>
                    <input type="text" id="genero" name="genero" placeholder="Ex: MPB, Rock, Samba...">
                </div>

                <div class="form-group">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais" placeholder="Ex: Brasil, EUA...">
                </div>

                <div class="form-group">
                    <label for="imagem">Foto do Artista</label>
                    <!-- type="file": abre a janela para escolher um arquivo.
                         accept="image/*": mostra apenas imagens. -->
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                    <!-- small: texto pequeno embaixo do campo -->
                    <small>JPG ou PNG. Máximo 5 MB</small>
                </div>
            </div><!-- fim .form-grid -->

            <!-- form-actions: área dos botões do formulário (flex). -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">💾 Cadastrar</button>
            </div>
        </form>

        <!-- TABELA DE ARTISTAS (dados fixo)
             Usa as classes da tabela da Biblioteca -->
        <h3>Artistas Cadastrados</h3> <!-- h3: subtítulo da tabela -->

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-foto">Foto</th>
                        <th>Nome</th>
                        <th>Gênero</th>
                        <th>País</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Cada tr é um artista. -->
                    <tr>
                        <td><div class="no-image">Sem<br>foto</div></td>
                        <td>Djavan</td>
                        <td>MPB</td>
                        <td>Brasil</td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️</a>
                                <!-- btn-music (verde): leva ao cadastro das músicas desse artista específico -->
                                <a href="cadastro_musica.html" class="btn-music">🎵 Músicas</a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><div class="no-image">Sem<br>foto</div></td>
                        <td>Marisa Monte</td>
                        <td>MPB</td>
                        <td>Brasil</td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️</a>
                                <a href="cadastro_musica.html" class="btn-music">🎵 Músicas</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
